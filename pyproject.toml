[project]
name = "code-assistant-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Melusi-M", email = "mncwangom@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
]

[project.scripts]
code-assistant-agent = "code_assistant_agent:main"

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
